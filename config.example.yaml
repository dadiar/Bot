# Copy to config.yaml and edit.  Never commit config.yaml or the profile/ folder.

streamer: "THEIR_TIKTOK_USERNAME"   # without the @

# dry-run : detect + print codes, never touches the browser (START HERE)
# confirm : asks Y/n in the terminal before each submit
# auto    : submits instantly
mode: dry-run
max_attempts: 5                      # hard cap on codes submitted per run
min_seconds_between_attempts: 1.0

# ---- where to listen -------------------------------------------------------
chat_enabled: true                   # fastest source (~instant)
trusted_chat_users: []               # [] = only the streamer's own messages; ["*"] = anyone (trolls will spam fake codes)

ocr_enabled: true                    # reads codes shown on screen (~0.5-1.5s lag)
ocr_fps: 2
ocr_keywords: [code, promo, redeem, coupon]   # a frame only counts if it contains one of these. [] = any text
# ocr_region: [0.0, 0.3, 1.0, 0.4]   # optional [x, y, w, h] crop as fractions of the frame (faster, fewer false hits)

audio_enabled: false                 # best effort: spoken codes are error-prone; needs a Whisper model download
audio_keywords: [code, promo, redeem, coupon]
whisper_model: base

# ---- what counts as a code --------------------------------------------------
# TIGHTEN THIS to the real format once you've seen a few codes, e.g. r"TS[A-Z0-9]{8}"
code_pattern: '[A-Z0-9][A-Z0-9-]{5,19}'
require_digit: true                  # ignore pure-letter words like "GIVEAWAY"
min_length: 6
max_length: 20
submit_case: upper                   # upper | lower | keep (use keep if codes are case sensitive)
extra_stopwords: []

# ---- the redeem page --------------------------------------------------------
redeem:
  url: "https://REPLACE_ME/the-page-with-the-code-box"
  # CSS selectors. Leave code_input as-is to try the built-in guess; run `python -m bot check` to verify.
  # code_input: 'input[name="promoCode"]'
  # submit_button: 'button[type=submit]'      # empty = press Enter in the box
  # success_selector: 'text=successfully'     # something that appears on success
  # error_selector: '.error, text=invalid'    # something that appears on failure
  result_timeout_s: 6
  headless: false                    # keep false: you need to see it / log in / solve any captcha
  profile_dir: profile               # your logged-in session lives here
