# Copy this file to config.yaml. You only need to change the parts marked  <-- CHANGE

# ===== 1. The stream ==========================================================
stream_url: "https://www.youtube.com/watch?v=u576qOKSTAk"     # <-- CHANGE when he starts a new live

# ===== 2. Your 4 account tabs =================================================
# One tab per account type. When a code is detected it is fired into ALL of them
# at once, so whichever account the code is for gets claimed.
redeem:
  accounts:
    - {name: "2k flex",  url: "https://PASTE-THE-2K-FLEX-REDEEM-PAGE-LINK"}    # <-- CHANGE
    - {name: "2k pro",   url: "https://PASTE-THE-2K-PRO-REDEEM-PAGE-LINK"}     # <-- CHANGE
    - {name: "50k flex", url: "https://PASTE-THE-50K-FLEX-REDEEM-PAGE-LINK"}   # <-- CHANGE
    - {name: "50k pro",  url: "https://PASTE-THE-50K-PRO-REDEEM-PAGE-LINK"}    # <-- CHANGE

  # Only touch these if `python -m bot check` says it can't find the code box:
  # code_input: 'input[name="promoCode"]'      # the code box
  # submit_button: 'button[type=submit]'       # the claim button (empty = press Enter)
  # success_selector: 'text=success'           # text that shows when it works
  # error_selector: 'text=invalid'             # text that shows when it fails
  headless: false
  profile_dir: profile                         # your saved login lives here

# ===== 3. How it behaves ======================================================
mode: auto                  # auto = claims instantly | confirm = asks you first | dry-run = only prints
max_attempts: 10            # max codes the bot submits by itself per run
stop_after_success: false   # keep going after a win (he gives away several per stream)

# ===== Advanced (you can ignore everything below) =============================
ocr_enabled: true           # read codes he shows on screen
ocr_fps: 2
ocr_keywords: [code, promo, redeem, coupon]   # screen must show one of these words. [] = any text
# ocr_region: [0.0, 0.5, 1.0, 0.5]   # only read part of the screen: [x, y, width, height] as fractions

chat_enabled: true          # read codes he types in chat (only his + mods' messages count)
trusted_chat_users: []

audio_enabled: false        # listen for codes he says out loud (slower, less accurate)
audio_keywords: [code, promo, redeem, coupon]
whisper_model: base

code_pattern: '[A-Z0-9][A-Z0-9-]{5,19}'   # what a code looks like
require_digit: true
min_length: 6
max_length: 20
submit_case: upper          # upper | lower | keep
min_seconds_between_attempts: 1.0
max_manual_entries: 20      # max codes YOU can type in per run
